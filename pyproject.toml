[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pakistan-utils"
version = "0.1.0"
description = "Validation and helper utilities for Pakistan"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.setuptools]
packages = ["pk_utils"]

[tool.pytest.ini_options]
pythonpath = ["."]
